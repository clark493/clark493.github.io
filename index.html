<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080711">
<title>AnimeZone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#080711;
  color:white;
  min-height:100vh;
}

a{
  text-decoration:none;
  color:inherit;
}

button,input{
  font-family:inherit;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#100d1c;
  border-bottom:1px solid #29243a;
}

.navbar{
  max-width:1200px;
  height:72px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#ff2492;
}

.logo span{
  color:white;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:white;
  font-weight:bold;
  font-size:16px;
}

nav a:hover,
nav a.active{
  color:#ff2492;
}

.menu{
  display:none;
  background:none;
  border:0;
  color:white;
  font-size:28px;
  cursor:pointer;
}

/* HERO */
.hero{
  max-width:1000px;
  margin:auto;
  text-align:center;
  padding:65px 20px 45px;
}

.hero h1{
  font-size:clamp(38px,7vw,58px);
  color:#ff2492;
  margin-bottom:12px;
}

.hero p{
  color:#bdb8ca;
  font-size:19px;
  margin-bottom:30px;
}

.search{
  max-width:650px;
  margin:auto;
}

.search input{
  width:100%;
  padding:18px 24px;
  border:0;
  outline:0;
  border-radius:35px;
  background:white;
  color:#111;
  font-size:18px;
}

/* MAIN */
main{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 70px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:32px;
  margin:20px 0 25px;
}

.section-title span{
  color:#ff2492;
}

/* GRID */
.anime-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.card{
  background:#14121e;
  border:1px solid #29243a;
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#ff2492;
  box-shadow:0 12px 30px rgba(255,36,146,.18);
}

.poster{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
  background:linear-gradient(135deg,#ff2492,#3020a3);
}

.card-body{
  padding:16px;
}

.card-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aaa5b5;
  font-size:14px;
  margin-bottom:15px;
}

.score{
  color:#ffd21c;
  font-weight:bold;
}

.watch-btn{
  display:block;
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#ff2492;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.watch-btn:hover{
  background:#ff4aa8;
}

/* EMPTY */
.empty{
  display:none;
  text-align:center;
  padding:50px 20px;
  color:#aaa5b5;
  font-size:18px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  background:#15121f;
  border:1px solid #302a43;
  border-radius:20px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:12px;
  border:0;
  background:none;
  color:white;
  font-size:30px;
  cursor:pointer;
}

.modal-poster{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:18px;
}

.modal h2{
  color:#ff2492;
  font-size:28px;
  margin-bottom:10px;
}

.modal p{
  color:#c7c2d0;
  line-height:1.6;
  margin-bottom:18px;
}

.modal-link{
  display:block;
  text-align:center;
  padding:13px;
  border-radius:10px;
  background:#ff2492;
  color:white;
  font-weight:bold;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px 20px;
  border-top:1px solid #29243a;
  color:#aaa5b5;
}

footer span{
  color:#ff2492;
}

/* MOBILE */
@media(max-width:900px){
  .anime-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .navbar{
    height:65px;
  }

  nav{
    display:none;
    position:absolute;
    top:65px;
    left:0;
    width:100%;
    background:#100d1c;
    flex-direction:column;
    padding:20px;
    gap:18px;
    border-bottom:1px solid #29243a;
  }

  nav.open{
    display:flex;
  }

  .menu{
    display:block;
  }

  .hero{
    padding-top:45px;
  }

  .anime-grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .poster{
    height:260px;
  }

  .card-body{
    padding:12px;
  }

  .card-title{
    font-size:16px;
  }

  .section-title{
    font-size:25px;
  }
}

@media(max-width:380px){
  .anime-grid{
    grid-template-columns:1fr;
  }

  .poster{
    height:380px;
  }
}
</style>
</head>

<body>

<header>
  <div class="navbar">

    <a href="#" class="logo">
      Anime<span>Zone</span>
    </a>

    <button class="menu" onclick="toggleMenu()">☰</button>

    <nav id="nav">
      <a href="#" class="active">Accueil</a>
      <a href="#anime">Anime</a>
      <a href="#recent">Récent</a>
    </nav>

  </div>
</header>

<section class="hero">

  <h1>AnimeZone</h1>

  <p>
    Découvrez vos anime préférés et regardez-les facilement.
  </p>

  <div class="search">
    <input
      type="search"
      id="search"
      placeholder="Rechercher un anime..."
      autocomplete="off"
    >
  </div>

</section>

<main id="anime">

  <h2 class="section-title">
    <span>🔥</span> Anime populaires
  </h2>

  <div class="anime-grid" id="animeGrid"></div>

  <div class="empty" id="empty">
    Aucun anime trouvé.
  </div>

</main>

<footer>
  © 2026 <span>AnimeZone</span> — Tous droits réservés.
</footer>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" id="close">×</button>

    <img
      id="modalPoster"
      class="modal-poster"
      src=""
      alt=""
    >

    <h2 id="modalTitle"></h2>

    <p id="modalDesc"></p>

    <a
      id="modalLink"
      class="modal-link"
      href="#"
      target="_blank"
      rel="noopener"
    >
      ▶ Regarder maintenant
    </a>

  </div>

</div>

<script>

const animeList = [

  {
    title:"One Piece",
    year:"1999",
    score:"9.0",
    image:"https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80",
    desc:"Suivez les aventures de Luffy et de son équipage à la recherche du légendaire One Piece.",
    link:"#"
  },

  {
    title:"Naruto",
    year:"2002",
    score:"8.8",
    image:"https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?auto=format&fit=crop&w=800&q=80",
    desc:"Naruto Uzumaki rêve de devenir le meilleur ninja de son village.",
    link:"#"
  },

  {
    title:"Demon Slayer",
    year:"2019",
    score:"8.7",
    image:"https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80",
    desc:"Tanjiro part combattre les démons afin de sauver sa sœur Nezuko.",
    link:"#"
  },

  {
    title:"Jujutsu Kaisen",
    year:"2020",
    score:"8.9",
    image:"https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=800&q=80",
    desc:"Yuji Itadori rejoint les exorcistes pour combattre les malédictions.",
    link:"#"
  },

  {
    title:"Attack on Titan",
    year:"2013",
    score:"9.1",
    image:"https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80",
    desc:"L'humanité tente de survivre derrière d'immenses murs face aux Titans.",
    link:"#"
  },

  {
    title:"My Hero Academia",
    year:"2016",
    score:"8.5",
    image:"https://images.unsplash.com/photo-1577083552431-6e5fd01988a5?auto=format&fit=crop&w=800&q=80",
    desc:"Izuku rêve de devenir un héros malgré son absence de pouvoir.",
    link:"#"
  },

  {
    title:"Dragon Ball",
    year:"1986",
    score:"8.8",
    image:"https://images.unsplash.com/photo-1560419015-7c427e8ae5ba?auto=format&fit=crop&w=800&q=80",
    desc:"Goku et ses amis vivent de nombreuses aventures à la recherche des Dragon Balls.",
    link:"#"
  },

  {
    title:"Bleach",
    year:"2004",
    score:"8.2",
    image:"https://images.unsplash.com/photo-1614583225154-5fcdda07019e?auto=format&fit=crop&w=800&q=80",
    desc:"Ichigo Kurosaki découvre le monde des Shinigami et doit protéger les humains.",
    link:"#"
  },

  {
    title:"Solo Leveling",
    year:"2024",
    score:"8.9",
    image:"https://images.unsplash.com/photo-1612198188060-c7c2a3b66eae?auto=format&fit=crop&w=800&q=80",
    desc:"Sung Jin-Woo devient progressivement le chasseur le plus puissant.",
    link:"#"
  },

  {
    title:"Death Note",
    year:"2006",
    score:"8.9",
    image:"https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=800&q=80",
    desc:"Light découvre un mystérieux carnet capable de tuer toute personne dont le nom y est inscrit.",
    link:"#"
  },

  {
    title:"Hunter x Hunter",
    year:"2011",
    score:"9.0",
    image:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80",
    desc:"Gon devient Hunter pour retrouver son père et découvre un monde rempli d'aventures.",
    link:"#"
  },

  {
    title:"Chainsaw Man",
    year:"2022",
    score:"8.6",
    image:"https://images.unsplash.com/photo-1531259683007-016a7b628fc3?auto=format&fit=crop&w=800&q=80",
    desc:"Denji fusionne avec son démon Chainsaw et rejoint une organisation spéciale.",
    link:"#"
  }

];

const grid = document.getElementById("animeGrid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

const modal = document.getElementById("modal");
const modalPoster = document.getElementById("modalPoster");
const modalTitle = document.getElementById("modalTitle");
const modalDesc = document.getElementById("modalDesc");
const modalLink = document.getElementById("modalLink");
const close = document.getElementById("close");

function displayAnime(list){

  grid.innerHTML = "";

  if(list.length === 0){
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  list.forEach(anime => {

    const card = document.createElement("article");
    card.className = "card";

    card.innerHTML = `
      <img
        class="poster"
        src="${anime.image}"
        alt="${anime.title}"
        loading="lazy"
      >

      <div class="card-body">

        <div class="card-title">
          ${anime.title}
        </div>

        <div class="info">
          <span>${anime.year}</span>
          <span class="score">★ ${anime.score}</span>
        </div>

        <button class="watch-btn">
          ▶ Regarder
        </button>

      </div>
    `;

    card.querySelector(".watch-btn").onclick = () => {
      openAnime(anime);
    };

    grid.appendChild(card);

  });
}

function openAnime(anime){

  modalTitle.textContent = anime.title;
  modalDesc.textContent = anime.desc;
  modalPoster.src = anime.image;
  modalPoster.alt = anime.title;
  modalLink.href = anime.link;

  modal.classList.add("show");
}

function closeModal(){
  modal.classList.remove("show");
}

close.onclick = closeModal;

modal.onclick = function(e){
  if(e.target === modal){
    closeModal();
  }
};

document.addEventListener("keydown",function(e){
  if(e.key === "Escape"){
    closeModal();
  }
});

search.addEventListener("input",function(){

  const value = search.value.toLowerCase().trim();

  const results = animeList.filter(anime =>
    anime.title.toLowerCase().includes(value)
  );

  displayAnime(results);

});

function toggleMenu(){
  document.getElementById("nav").classList.toggle("open");
}

document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click",function(){
    document.getElementById("nav").classList.remove("open");
  });
});

displayAnime(animeList);

</script>

</body>
</html>
