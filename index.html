<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RABESAIKY ANIME</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#08070d;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:75px;
}

header{
  height:70px;
  background:#100d17;
  border-bottom:1px solid #272230;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#ff2f8a;
  font-size:27px;
  font-weight:900;
}

nav{
  display:flex;
  gap:30px;
}

nav button{
  background:none;
  border:0;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:55px 20px 70px;
  background:
    radial-gradient(circle at center top,#35164c,#100b18 55%,#08070d);
}

.hero h1{
  font-size:45px;
  line-height:1.2;
}

.hero h1 span{
  color:#ff2f8a;
}

.hero p{
  color:#bdb8c5;
  font-size:19px;
  margin:20px 0 28px;
}

.search{
  max-width:580px;
  height:62px;
  margin:auto;
  background:#fff;
  border-radius:40px;
  display:flex;
  align-items:center;
  padding:0 20px;
}

.search span{
  font-size:25px;
}

.search input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  font-size:17px;
  padding-left:10px;
  color:#222;
}

main{
  max-width:1200px;
  margin:auto;
  padding:45px 25px;
}

.section{
  margin-bottom:55px;
}

.section h2{
  font-size:30px;
  margin-bottom:25px;
}

.section h2 span{
  color:#ff2f8a;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

.card{
  background:#171522;
  border:1px solid #292532;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#ff2f8a;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  background:#21192a;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  padding:15px;
}

.title{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rating{
  color:#ffd21c;
  margin-top:11px;
  font-size:16px;
}

.type{
  color:#999;
  margin-top:8px;
}

.sns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.sns div{
  background:#171522;
  border:1px solid #292532;
  border-radius:15px;
  padding:25px;
  text-align:center;
}

.sns strong{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.sns small{
  color:#999;
}

footer{
  text-align:center;
  color:#777;
  border-top:1px solid #24202c;
  padding:30px;
}

footer b{
  color:#ff2f8a;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:800px;
  max-height:90vh;
  overflow:auto;
  background:#15121e;
  border-radius:18px;
  border:1px solid #30293a;
}

.top{
  padding:18px 20px;
  border-bottom:1px solid #292331;
  display:flex;
  justify-content:space-between;
}

.close{
  background:#292430;
  color:white;
  border:0;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:22px;
}

.detail{
  padding:22px;
  display:flex;
  gap:20px;
}

.detail img{
  width:170px;
  height:255px;
  object-fit:cover;
  border-radius:12px;
}

.detail h2{
  font-size:28px;
  margin-bottom:12px;
}

.desc{
  color:#aaa;
  line-height:1.6;
}

.episodes{
  padding:0 22px 25px;
}

.episodes h3{
  margin-bottom:15px;
}

.ep{
  background:#292431;
  color:#fff;
  border:0;
  padding:10px 13px;
  margin:4px;
  border-radius:7px;
}

.ep:hover{
  background:#ff2f8a;
}

/* MOBILE */

.mobile{
  display:none;
}

@media(max-width:700px){

  header{
    padding:0 18px;
  }

  .logo{
    font-size:22px;
  }

  nav{
    gap:18px;
  }

  nav button{
    font-size:15px;
  }

  .hero{
    padding:45px 18px 55px;
  }

  .hero h1{
    font-size:35px;
  }

  .hero p{
    font-size:17px;
  }

  main{
    padding:35px 15px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .section h2{
    font-size:28px;
  }

  .info{
    padding:13px;
  }

  .title{
    font-size:15px;
  }

  .sns{
    grid-template-columns:repeat(2,1fr);
  }

  .detail{
    flex-direction:column;
  }

  .detail img{
    width:145px;
    height:215px;
  }

  .mobile{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#12101a;
    border-top:1px solid #292431;
    display:flex;
    z-index:200;
  }

  .mobile button{
    flex:1;
    background:none;
    border:0;
    color:#999;
    font-size:12px;
  }

  .mobile button:first-child{
    color:#ff2f8a;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">RABESAIKY ANIME</div>

  <nav>
    <button onclick="goHome()">Accueil</button>
    <button onclick="goAnime()">Anime</button>
  </nav>
</header>

<section class="hero">

  <h1>
    Bienvenue sur <span>Anime<br>Manga</span>
  </h1>

  <p>
    Découvrez vos anime et manga préférés.
  </p>

  <div class="search">
    <span>🔎</span>
    <input
      id="search"
      type="text"
      placeholder="Rechercher un anime ou manga..."
      oninput="searchAnime()"
    >
  </div>

</section>

<main>

  <section class="section">

    <h2>
      🔥 Anime <span>populaires</span>
    </h2>

    <div class="grid" id="popular"></div>

  </section>


  <section class="section">

    <h2>
      ✨ Anime <span>récents</span>
    </h2>

    <div class="grid" id="recent"></div>

  </section>


  <section class="section">

    <h2>
      📱 <span>SNS</span>
    </h2>

    <div class="sns">

      <div>
        <strong>Telegram</strong>
        <small>RABESAIKY ANIME</small>
      </div>

      <div>
        <strong>TikTok</strong>
        <small>Nos nouveautés</small>
      </div>

      <div>
        <strong>Facebook</strong>
        <small>Notre communauté</small>
      </div>

      <div>
        <strong>Instagram</strong>
        <small>RABESAIKY ANIME</small>
      </div>

    </div>

  </section>

</main>

<footer>
  <b>RABESAIKY ANIME</b>
  <br><br>
  © 2026 RABESAIKY ANIME
</footer>


<!-- FICHE ANIME -->

<div class="modal" id="modal">

  <div class="box">

    <div class="top">
      <b>RABESAIKY ANIME</b>

      <button class="close" onclick="closeAnime()">×</button>
    </div>

    <div class="detail">

      <img id="detailImage">

      <div>

        <h2 id="detailTitle"></h2>

        <div id="detailRating" class="rating"></div>

        <p id="detailDesc" class="desc"></p>

      </div>

    </div>

    <div class="episodes">

      <h3>📺 Épisodes</h3>

      <div id="episodes"></div>

    </div>

  </div>

</div>


<!-- MENU MOBILE -->

<div class="mobile">

  <button onclick="goHome()">
    🏠<br>Accueil
  </button>

  <button onclick="goAnime()">
    🎬<br>Anime
  </button>

  <button onclick="goSNS()">
    📱<br>SNS
  </button>

  <button onclick="focusSearch()">
    🔎<br>Recherche
  </button>

</div>


<script>

/* ================================
   ANIMES
================================ */

const animes = [

{
 title:"Sousou no Frieren",
 rating:"9.3",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1015/138006.jpg",
 desc:"Après la fin d'une grande aventure, Frieren poursuit son voyage.",
 episodes:28
},

{
 title:"Re:Zero kara Hajimeru Isekai Seikatsu",
 rating:"9.2",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1522/128039.jpg",
 desc:"Subaru se retrouve dans un monde mystérieux.",
 episodes:25
},

{
 title:"One Piece",
 rating:"9.0",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1244/138851.jpg",
 desc:"Luffy et son équipage parcourent les mers.",
 episodes:20
},

{
 title:"Demon Slayer",
 rating:"8.9",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg",
 desc:"Tanjiro commence une aventure contre les démons.",
 episodes:26
},

{
 title:"Jujutsu Kaisen",
 rating:"8.8",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1171/109222.jpg",
 desc:"Yuji découvre le monde dangereux des malédictions.",
 episodes:24
},

{
 title:"Naruto",
 rating:"8.7",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/13/17405.jpg",
 desc:"Naruto rêve de devenir le plus grand ninja.",
 episodes:220
},

{
 title:"Solo Leveling",
 rating:"8.8",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1702/139407.jpg",
 desc:"Sung Jin-Woo devient progressivement plus puissant.",
 episodes:12
},

{
 title:"Dragon Ball",
 rating:"8.7",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/6/140675.jpg",
 desc:"Goku et ses amis vivent de grandes aventures.",
 episodes:153
},

{
 title:"My Hero Academia",
 rating:"8.6",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/10/78745.jpg",
 desc:"Izuku rêve de devenir un héros.",
 episodes:13
},

{
 title:"Spy x Family",
 rating:"8.5",
 type:"TV",
 image:"https://cdn.myanimelist.net/images/anime/1441/122795.jpg",
 desc:"Une famille créée pour une mission secrète.",
 episodes:25
}

];


/* ================================
   CARTE
================================ */

function card(anime){

  return `
    <div class="card" onclick='openAnime(${JSON.stringify(anime)})'>

      <div class="poster">

        <img
          src="${anime.image}"
          alt="${anime.title}"
          onerror="this.style.display='none'"
        >

      </div>

      <div class="info">

        <div class="title">
          ${anime.title}
        </div>

        <div class="rating">
          ⭐ ${anime.rating}
        </div>

        <div class="type">
          ${anime.type}
        </div>

      </div>

    </div>
  `;
}


/* ================================
   AFFICHER
================================ */

function render(){

  document.getElementById("popular").innerHTML =
    animes.slice(0,6).map(card).join("");

  document.getElementById("recent").innerHTML =
    animes.slice(4,10).map(card).join("");

}


/* ================================
   RECHERCHE
================================ */

function searchAnime(){

  const text =
    document.getElementById("search")
    .value
    .toLowerCase();

  if(!text){

    render();
    return;

  }

  const result =
    animes.filter(a =>
      a.title.toLowerCase().includes(text)
    );

  document.getElementById("popular").innerHTML =
    result.map(card).join("");

  document.getElementById("recent").innerHTML = "";

}


/* ================================
   FICHE
================================ */

function openAnime(anime){

  document.getElementById("modal")
    .classList.add("show");

  document.getElementById("detailImage")
    .src = anime.image;

  document.getElementById("detailTitle")
    .textContent = anime.title;

  document.getElementById("detailRating")
    .textContent =
      "⭐ " + anime.rating + " • " + anime.type;

  document.getElementById("detailDesc")
    .textContent = anime.desc;


  let html="";

  for(let i=1;i<=anime.episodes;i++){

    html += `
      <button
        class="ep"
        onclick="episode(${i})"
      >
        Épisode ${i}
      </button>
    `;

  }

  document.getElementById("episodes")
    .innerHTML = html;

}


function closeAnime(){

  document.getElementById("modal")
    .classList.remove("show");

}


function episode(number){

  alert(
    "Épisode " + number +
    " : ajoute ta vidéo dans ton site pour la lire ici."
  );

}


/* ================================
   NAVIGATION
================================ */

function goHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function goAnime(){

  document.querySelector(".section")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function goSNS(){

  const sections =
    document.querySelectorAll(".section");

  sections[2].scrollIntoView({
    behavior:"smooth"
  });

}


function focusSearch(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  setTimeout(()=>{

    document.getElementById("search")
      .focus();

  },400);

}


/* ================================
   DÉMARRAGE
================================ */

render();

</script>

</body>
</html>
