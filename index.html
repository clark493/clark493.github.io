<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AnimeZone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080711;
      color: white;
      min-height: 100vh;
    }

    /* NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #100d1c;
      border-bottom: 1px solid #29243a;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: #ff2492;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    nav a.active,
    nav a:hover {
      color: #ff2492;
    }

    /* HERO */
    .hero {
      max-width: 1000px;
      margin: auto;
      text-align: center;
      padding: 55px 20px 35px;
    }

    .hero h1 {
      font-size: 52px;
      color: #ff2492;
      margin-bottom: 12px;
    }

    .hero p {
      color: #bdb8ca;
      font-size: 20px;
      margin-bottom: 30px;
    }

    .search-box {
      max-width: 600px;
      margin: auto;
    }

    #search {
      width: 100%;
      padding: 18px 24px;
      border: none;
      outline: none;
      border-radius: 35px;
      background: white;
      color: #111;
      font-size: 18px;
    }

    /* CONTENT */
    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 32px;
      margin: 20px 0 25px;
    }

    .section-title span {
      color: #ff2492;
    }

    /* GRID */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .card {
      background: #14121e;
      border: 1px solid #29243a;
      border-radius: 18px;
      overflow: hidden;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #ff2492;
      box-shadow: 0 12px 30px rgba(255, 36, 146, 0.15);
    }

    .poster {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #ff2492, #42145e);
    }

    .card-body {
      padding: 16px;
    }

    .card-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #aaa5b5;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .score {
      color: #ffd21c;
      font-weight: bold;
    }

    .watch-btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff2492;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .watch-btn:hover {
      background: #ff4aa8;
    }

    /* EMPTY */
    .empty {
      display: none;
      text-align: center;
      padding: 50px 20px;
      color: #aaa5b5;
      font-size: 18px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: #15121f;
      border: 1px solid #302a43;
      border-radius: 20px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 18px;
      top: 12px;
      border: none;
      background: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .modal-content {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .modal-img {
      width: 190px;
      height: 270px;
      object-fit: cover;
      border-radius: 12px;
    }

    .modal-info h2 {
      color: #ff2492;
      margin-bottom: 15px;
      font-size: 28px;
    }

    .modal-info p {
      color: #c4bfce;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .trailer-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #ff2492;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* FOOTER */
    footer {
      background: #100d1c;
      border-top: 1px solid #29243a;
      text-align: center;
      padding: 25px;
      color: #888394;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .anime-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .navbar {
        height: 62px;
      }

      .logo {
        font-size: 22px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 14px;
      }

      .hero {
        padding-top: 40px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .hero p {
        font-size: 17px;
      }

      .anime-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .poster {
        height: 250px;
      }

      .card-body {
        padding: 12px;
      }

      .card-title {
        font-size: 16px;
      }

      .modal-content {
        flex-direction: column;
      }

      .modal-img {
        width: 160px;
        height: 230px;
        margin: auto;
      }
    }

    @media (max-width: 400px) {
      .anime-grid {
        grid-template-columns: 1fr 1fr;
      }

      .poster {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="navbar">
      <div class="logo">ANIMEZONE</div>

      <nav>
        <a href="#" class="active">Accueil</a>
        <a href="#anime">Anime</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>AnimeZone</h1>

    <p>
      Découvrez vos anime préférés.
    </p>

    <div class="search-box">
      <input
        type="text"
        id="search"
        placeholder="Rechercher un anime..."
        autocomplete="off"
      >
    </div>
  </section>

  <main id="anime">

    <h2 class="section-title">
      🔥 Anime <span>populaires</span>
    </h2>

    <div id="animeGrid" class="anime-grid"></div>

    <div id="empty" class="empty">
      Aucun anime trouvé.
    </div>

  </main>

  <!-- MODAL -->
  <div id="modal" class="modal">

    <div class="modal-box">

      <button id="closeModal" class="close">
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>

  <footer>
    © 2026 AnimeZone — Tous droits réservés
  </footer>

  <!-- BASE DE DONNÉES -->
  <script src="anime-data.js"></script>

  <script>

    const grid = document.getElementById("animeGrid");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");

    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");
    const closeModal = document.getElementById("closeModal");


    function afficherAnime(liste) {

      grid.innerHTML = "";

      if (liste.length === 0) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";


      liste.forEach(anime => {

        const card = document.createElement("div");

        card.className = "card";


        card.innerHTML = `
          <img
            class="poster"
            src="${anime.image}"
            alt="${anime.title}"
            loading="lazy"
            onerror="this.src='https://placehold.co/400x550/24113d/ffffff?text=Anime'"
          >

          <div class="card-body">

            <div class="card-title">
              ${anime.title}
            </div>

            <div class="info">

              <span>
                ${anime.type}
              </span>

              <span class="score">
                ⭐ ${anime.score}
              </span>

            </div>

            <button
              class="watch-btn"
              onclick="ouvrirAnime(${anime.id})"
            >
              ▶ Regarder
            </button>

          </div>
        `;


        grid.appendChild(card);

      });

    }


    function ouvrirAnime(id) {

      const anime = ANIME_DATA.find(a => a.id === id);

      if (!anime) return;


      const youtubeSearch =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(anime.title + " official trailer");


      modalContent.innerHTML = `

        <div class="modal-content">

          <img
            class="modal-img"
            src="${anime.image}"
            alt="${anime.title}"
            onerror="this.src='https://placehold.co/400x550/24113d/ffffff?text=Anime'"
          >

          <div class="modal-info">

            <h2>
              ${anime.title}
            </h2>

            <p>
              <strong>Type :</strong>
              ${anime.type}
            </p>

            <p>
              <strong>Épisodes :</strong>
              ${anime.episodes}
            </p>

            <p>
              <strong>Note :</strong>
              ⭐ ${anime.score}
            </p>

            <p>
              ${anime.description}
            </p>

            <a
              class="trailer-btn"
              href="${youtubeSearch}"
              target="_blank"
              rel="noopener"
            >
              ▶ Voir la bande-annonce
            </a>

          </div>

        </div>

      `;


      modal.classList.add("show");

    }


    search.addEventListener("input", () => {

      const q =
        search.value
          .toLowerCase()
          .trim();


      const resultats =
        ANIME_DATA.filter(anime =>
          anime.title
            .toLowerCase()
            .includes(q)
        );


      afficherAnime(resultats);

    });


    closeModal.addEventListener("click", () => {

      modal.classList.remove("show");

    });


    modal.addEventListener("click", event => {

      if (event.target === modal) {
        modal.classList.remove("show");
      }

    });


    afficherAnime(ANIME_DATA);

  </script>

</body>
  </html>
