<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RABESAIKY ANIME</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#08050d;
  color:white;
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#100a18;
  border-bottom:1px solid #2b1838;
  padding:14px 18px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#ff2f8a;
  font-size:24px;
  font-weight:900;
}

.logo img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ff2f8a;
}

nav{
  display:flex;
  gap:8px;
}

nav button{
  background:transparent;
  border:0;
  color:#ddd;
  padding:10px 13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

nav button:hover,
nav button.active{
  background:#ff2f8a;
  color:white;
}

.hero{
  max-width:1100px;
  margin:25px auto;
  padding:45px 20px;
  text-align:center;
  background:linear-gradient(135deg,#21102e,#100817);
  border:1px solid #321944;
  border-radius:22px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#bbb;
  margin-bottom:25px;
}

.search{
  max-width:600px;
  margin:auto;
  display:flex;
  gap:10px;
}

.search input{
  flex:1;
  padding:15px;
  border-radius:12px;
  border:1px solid #3c2549;
  background:#0d0912;
  color:white;
  outline:none;
}

.search button{
  padding:0 20px;
  border:0;
  border-radius:12px;
  background:#ff2f8a;
  color:white;
  font-weight:bold;
}

main{
  max-width:1100px;
  margin:auto;
  padding:0 18px 100px;
}

section{
  margin-top:35px;
}

.section-title{
  font-size:25px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.card{
  background:#120c19;
  border:1px solid #2d1a38;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#ff2f8a;
}

.poster{
  height:260px;
  background:linear-gradient(135deg,#35194d,#170d20);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.poster-fallback{
  display:none;
  text-align:center;
  padding:10px;
  color:#ff6eaa;
  font-weight:bold;
  font-size:18px;
}

.info{
  padding:12px;
}

.info h3{
  font-size:16px;
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#aaa;
}

.rating{
  color:#ffd54a;
}

.sns{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.sns-box{
  background:#120c19;
  border:1px solid #2d1a38;
  border-radius:15px;
  padding:25px;
  text-align:center;
}

.sns-box h3{
  margin-bottom:8px;
}

.sns-box p{
  color:#aaa;
}

footer{
  text-align:center;
  color:#777;
  padding:30px;
}

.bottom-nav{
  display:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.85);
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  background:#120c19;
  border:1px solid #ff2f8a;
  border-radius:20px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  background:#ff2f8a;
  border:0;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.modal-box h2{
  color:#ff2f8a;
  margin-bottom:15px;
}

.modal-box p{
  color:#ccc;
  line-height:1.6;
  margin-bottom:15px;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  header{
    padding:10px;
  }

  .logo{
    font-size:18px;
  }

  .logo img{
    width:38px;
    height:38px;
  }

  nav{
    display:none;
  }

  .hero{
    margin:15px 10px;
    padding:35px 15px;
  }

  .hero h1{
    font-size:28px;
  }

  main{
    padding:0 10px 90px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .poster{
    height:230px;
  }

  .sns{
    grid-template-columns:1fr;
  }

  .bottom-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:150;
    background:#100a18;
    border-top:1px solid #321944;
    justify-content:space-around;
    padding:10px 5px;
  }

  .bottom-nav button{
    background:none;
    border:0;
    color:#bbb;
    font-size:12px;
    padding:5px;
  }

  .bottom-nav button.active{
    color:#ff2f8a;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      <img src="https://clark493.github.io/profil.jpg" alt="Profil">
      <span>RABESAIKY ANIME</span>
    </div>

    <nav>
      <button onclick="goHome()">Accueil</button>
      <button onclick="goAnime()">Anime</button>
      <button onclick="goSNS()">SNS</button>
    </nav>

  </div>
</header>

<div class="hero" id="accueil">
  <h1>Bienvenue sur Anime Manga</h1>
  <p>Découvre tes anime préférés au même endroit.</p>

  <div class="search">
    <input id="searchInput" type="text" placeholder="Rechercher un anime...">
    <button onclick="searchAnime()">Rechercher</button>
  </div>
</div>

<main>

<section id="anime">
  <h2 class="section-title">🔥 Anime populaires</h2>
  <div class="grid" id="popularGrid"></div>
</section>

<section>
  <h2 class="section-title">✨ Anime récents</h2>
  <div class="grid" id="recentGrid"></div>
</section>

<section id="sns">
  <h2 class="section-title">📱 SNS</h2>

  <div class="sns">

    <div class="sns-box">
      <h3>📸 Instagram</h3>
      <p>RABESAIKY ANIME</p>
    </div>

    <div class="sns-box">
      <h3>🎵 TikTok</h3>
      <p>Anime & Manga</p>
    </div>

    <div class="sns-box">
      <h3>▶️ YouTube</h3>
      <p>Vidéos Anime</p>
    </div>

  </div>
</section>

</main>

<footer>
  © 2026 RABESAIKY ANIME
</footer>

<div class="bottom-nav">
  <button onclick="goHome()">🏠<br>Accueil</button>
  <button onclick="goAnime()">🎬<br>Anime</button>
  <button onclick="goSNS()">📱<br>SNS</button>
  <button onclick="focusSearch()">🔎<br>Recherche</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle"></h2>
    <p id="modalInfo"></p>
    <p id="modalDesc"></p>
  </div>
</div>

<script>

const animes = [

{
  title:"Jujutsu Kaisen",
  rating:"8.6",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1171/109222.jpg",
  desc:"Yuji Itadori rejoint le monde des exorcistes et affronte de puissantes malédictions."
},

{
  title:"Naruto",
  rating:"8.4",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/13/17405.jpg",
  desc:"Naruto rêve de devenir le meilleur ninja de son village."
},



{
  title:"Dragon Ball",
  rating:"8.7",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1887/92364.jpg",
  desc:"Goku et ses amis vivent de grandes aventures à la recherche des Dragon Balls."
},

{
  title:"One Piece",
  rating:"9.0",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1244/138851.jpg",
  desc:"Luffy et son équipage partent à la recherche du légendaire One Piece."
},

{
  title:"Demon Slayer",
  rating:"8.6",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg",
  desc:"Tanjiro devient chasseur de démons afin de sauver sa sœur."
},

{
  title:"Frieren",
  rating:"9.0",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1015/138006.jpg",
  desc:"Frieren voyage après la fin de la grande aventure de son ancien groupe."
},

{
  title:"Re:Zero",
  rating:"8.2",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1522/128039.jpg",
  desc:"Subaru découvre qu'il possède un mystérieux pouvoir lié au temps."
},

{
  title:"My Hero Academia",
  rating:"8.0",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/10/78745.jpg",
  desc:"Izuku rêve de devenir un héros dans un monde où les pouvoirs sont communs."
},

{
  title:"Spy x Family",
  rating:"8.5",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1441/122795.jpg",
  desc:"Une famille pas comme les autres tente de cacher ses véritables secrets."
},
{
  title:"Kaiju No. 8",
  rating:"8.3",
  type:"TV",
  image:"https://images.weserv.nl/?url=cdn.myanimelist.net/images/anime/1000/141005.jpg",
  desc:"Kafka Hibino rêve de rejoindre les forces de défense et se retrouve lié à un mystérieux kaiju."
},

{
  title:"Ajin",
  rating:"7.8",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1528/112242.jpg",
  desc:"Kei découvre qu'il est un Ajin et doit fuir alors que ses pouvoirs sont recherchés."
},

{
  title:"To Be Hero X",
  rating:"8.0",
  type:"TV",
  image:"https://cdn.myanimelist.net/images/anime/1155/148338.jpg",
  desc:"Dans un monde où la confiance du public détermine les pouvoirs des héros."
},
];

function createCard(anime){

  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
    <div class="poster">
      <img src="${anime.image}" alt="${anime.title}">
      <div class="poster-fallback">${anime.title}</div>
    </div>

    <div class="info">
      <h3>${anime.title}</h3>

      <div class="meta">
        <span class="rating">⭐ ${anime.rating}</span>
        <span>${anime.type}</span>
      </div>
    </div>
  `;

  const img=card.querySelector("img");
  const fallback=card.querySelector(".poster-fallback");

  img.onerror=function(){
    img.style.display="none";
    fallback.style.display="block";
  };

  card.onclick=function(){
    openAnime(anime);
  };

  return card;
}

function render(list=animes){

  const popular=document.getElementById("popularGrid");
  const recent=document.getElementById("recentGrid");

  popular.innerHTML="";
  recent.innerHTML="";

  list.slice(0,5).forEach(anime=>{
    popular.appendChild(createCard(anime));
  });

  list.slice(5).forEach(anime=>{
    recent.appendChild(createCard(anime));
  });
}

function searchAnime(){

  const text=document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  if(text===""){
    render();
    return;
  }

  const result=animes.filter(anime =>
    anime.title.toLowerCase().includes(text)
  );

  render(result);

  document.getElementById("anime")
    .scrollIntoView({behavior:"smooth"});
}

function focusSearch(){

  document
    .getElementById("searchInput")
    .focus();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function openAnime(anime){

  document.getElementById("modalTitle").textContent=anime.title;

  document.getElementById("modalInfo").textContent=
    "⭐ Note : "+anime.rating+"   •   📺 "+anime.type;

  document.getElementById("modalDesc").textContent=
    anime.desc;

  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function goHome(){
  document.getElementById("accueil")
    .scrollIntoView({behavior:"smooth"});
}

function goAnime(){
  document.getElementById("anime")
    .scrollIntoView({behavior:"smooth"});
}

function goSNS(){
  document.getElementById("sns")
    .scrollIntoView({behavior:"smooth"});
}

document
  .getElementById("searchInput")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      searchAnime();
    }

  });

render();

</script>

</body>
  </html>
