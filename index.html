<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Manga</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#08080f;
  color:white;
}
header{
  background:#11101c;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #292438;
}
.logo{
  color:#ff3d81;
  font-size:25px;
  font-weight:900;
}
nav a{
  color:white;
  text-decoration:none;
  margin-left:25px;
  font-weight:bold;
}
.hero{
  text-align:center;
  padding:80px 20px;
  background:
  radial-gradient(circle at top,#422052,#100d1c 60%);
}
.hero h1{font-size:48px;margin-bottom:15px}
.hero h1 span{color:#ff3d81}
.hero p{color:#bbb;font-size:18px;margin-bottom:30px}
.search{
  width:90%;
  max-width:650px;
  padding:18px 25px;
  border:none;
  border-radius:40px;
  font-size:16px;
  outline:none;
}
.container{padding:45px 6%}
.title{
  font-size:28px;
  margin-bottom:25px;
}
.title span{color:#ff3d81}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:22px;
}
.card{
  background:#151420;
  border-radius:15px;
  overflow:hidden;
  transition:.3s;
  border:1px solid #252235;
}
.card:hover{
  transform:translateY(-7px);
  border-color:#ff3d81;
  box-shadow:0 10px 30px #0008;
}
.card img{
  width:100%;
  height:270px;
  object-fit:cover;
  display:block;
}
.info{padding:15px}
.info h3{
  font-size:17px;
  margin-bottom:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.rating{color:#ffd43b}
.type{
  color:#aaa;
  font-size:13px;
  margin-top:7px;
}
.loading{
  text-align:center;
  color:#aaa;
  padding:40px;
}
footer{
  text-align:center;
  padding:35px;
  background:#11101c;
  color:#888;
  margin-top:30px;
}
@media(max-width:600px){
  .hero{padding:60px 15px}
  .hero h1{font-size:36px}
  header{padding:15px 20px}
  nav a{margin-left:10px;font-size:14px}
  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .card img{height:230px}
}
</style>
</head>

<body>

<header>
  <div class="logo">ANIME MANGA</div>
  <nav>
    <a href="#">Accueil</a>
    <a href="#anime">Anime</a>
  </nav>
</header>

<section class="hero">
  <h1>Bienvenue sur <span>Anime Manga</span></h1>
  <p>Découvrez vos anime et manga préférés.</p>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Rechercher un anime ou manga..."
  >
</section>

<section class="container" id="anime">
  <h2 class="title">🔥 Anime <span>populaires</span></h2>
  <div id="animeList" class="grid">
    <div class="loading">Chargement des anime...</div>
  </div>
</section>

<footer>
  © 2026 Anime Manga — Tous droits réservés
</footer>

<script>
const list = document.getElementById("animeList");
const search = document.getElementById("search");

async function loadAnime(url) {
  list.innerHTML = '<div class="loading">Chargement...</div>';

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Erreur API : " + response.status);
    }

    const data = await response.json();

    if (!data.data || data.data.length === 0) {
      list.innerHTML = '<div class="loading">Aucun anime trouvé.</div>';
      return;
    }

    list.innerHTML = "";

    data.data.forEach(anime => {
      const title =
        anime.title ||
        anime.title_english ||
        anime.title_japanese ||
        "Anime";

      const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";

      const score =
        anime.score != null ? anime.score : "N/A";

      const type =
        anime.type || "Anime";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${image}" alt="${title}">
        <div class="info">
          <h3>${title}</h3>
          <div class="rating">⭐ ${score}</div>
          <div class="type">${type}</div>
        </div>
      `;

      list.appendChild(card);
    });

  } catch (error) {
    console.error(error);
    list.innerHTML =
      '<div class="loading">Impossible de charger les anime.</div>';
  }
}

loadAnime("https://api.jikan.moe/v4/top/anime?limit=12");

let timer;

search.addEventListener("input", () => {
  clearTimeout(timer);

  timer = setTimeout(() => {
    const q = search.value.trim();

    if (q.length < 2) {
      loadAnime("https://api.jikan.moe/v4/top/anime?limit=12");
      return;
    }

    loadAnime(
      "https://api.jikan.moe/v4/anime?q=" +
      encodeURIComponent(q) +
      "&limit=12"
    );
  }, 500);
});

</script>
</body>
</html>
