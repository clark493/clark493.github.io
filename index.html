<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<title>RABESAIKY ANIME</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07050a;
  color:white;
  padding-bottom:90px;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  height:74px;
  background:#0d0812;
  border-bottom:1px solid #24152d;
  display:flex;
  align-items:center;
  padding:10px 22px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  color:#ff2f8a;
  font-size:25px;
  font-weight:900;
}

.logo img{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ff2f8a;
}

nav{
  margin-left:auto;
  display:flex;
  gap:10px;
}

nav button{
  background:transparent;
  color:#ddd;
  border:0;
  padding:10px 15px;
  font-size:15px;
  cursor:pointer;
}

nav button:hover{
  color:#ff2f8a;
}

.hero{
  margin:26px 17px 40px;
  padding:42px 25px;
  border-radius:28px;
  background:linear-gradient(135deg,#24102f,#11091b);
  border:1px solid #351848;
  text-align:left;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#c8becd;
  font-size:18px;
  margin-bottom:30px;
}

.search{
  display:flex;
  gap:12px;
}

.search input{
  flex:1;
  background:#09060d;
  border:1px solid #472354;
  border-radius:18px;
  padding:17px;
  color:white;
  font-size:16px;
  outline:none;
}

.search input:focus{
  border-color:#ff2f8a;
}

.search button{
  background:#ff2f8a;
  color:white;
  border:0;
  border-radius:18px;
  padding:0 25px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

section{
  padding:0 18px;
  margin-bottom:45px;
}

.section-title{
  font-size:28px;
  margin-bottom:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.card{
  background:#100b16;
  border:1px solid #271630;
  border-radius:20px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#ff2f8a;
}

.poster{
  position:relative;
  width:100%;
  height:300px;
  background:linear-gradient(135deg,#311441,#100a16);
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-fallback{
  display:none;
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-size:25px;
  font-weight:bold;
  color:#ff2f8a;
}

.info{
  padding:15px;
}

.info h3{
  font-size:20px;
  margin-bottom:10px;
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:14px;
  margin-bottom:13px;
}

.rating{
  color:#ffd23f;
}

.episodes-btn{
  width:100%;
  padding:11px;
  border:1px solid #ff2f8a;
  border-radius:12px;
  background:#ff2f8a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.episodes-btn:hover{
  background:#d91f72;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px;
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  background:#100b18;
  border:2px solid #ff2f8a;
  border-radius:24px;
  padding:22px;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:#271329;
  color:white;
  font-size:23px;
  cursor:pointer;
}

.modal h2{
  color:#ff2f8a;
  margin:5px 45px 10px 0;
}

.modal-info{
  color:#aaa;
  margin-bottom:15px;
}

.modal-desc{
  color:#ddd;
  line-height:1.6;
}

.player{
  margin-top:20px;
  background:#050408;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #302036;
}

.player video{
  width:100%;
  display:block;
  max-height:390px;
  background:#000;
}

.player-message{
  padding:18px;
  text-align:center;
  color:#aaa;
}

.episode-title{
  margin-top:25px;
  margin-bottom:12px;
  font-size:20px;
  color:#fff;
}

.episode-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.episode{
  padding:11px 5px;
  border:1px solid #472354;
  background:#170d20;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.episode:hover,
.episode.active{
  background:#ff2f8a;
  border-color:#ff2f8a;
}

.sns{
  background:#100b16;
  border:1px solid #281630;
  border-radius:20px;
  padding:25px;
  text-align:center;
}

.sns p{
  color:#bbb;
  margin-bottom:18px;
}

.sns button{
  border:1px solid #ff2f8a;
  background:#ff2f8a;
  color:white;
  border-radius:12px;
  padding:12px 22px;
  cursor:pointer;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#0e0913;
  border-top:1px solid #281630;
  z-index:2000;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom-nav button{
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
}

.bottom-nav button span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.bottom-nav button:hover{
  color:#ff2f8a;
}

@media(max-width:600px){

  header{
    height:70px;
    padding:8px 17px;
  }

  .logo{
    font-size:22px;
  }

  .logo img{
    width:48px;
    height:48px;
  }

  nav{
    display:none;
  }

  .hero{
    padding:34px 22px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:16px;
  }

  .search{
    flex-direction:column;
  }

  .search button{
    height:52px;
  }

  .cards{
    gap:14px;
  }

  .poster{
    height:270px;
  }

  .info{
    padding:12px;
  }

  .info h3{
    font-size:17px;
  }

  .episode-list{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:400px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .poster{
    height:220px;
  }

  .logo{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    <img src="./profil.jpg" alt="Profil">
    <span>RABESAIKY ANIME</span>
  </div>

  <nav>
    <button onclick="goHome()">🏠 Accueil</button>
    <button onclick="goAnime()">🎬 Anime</button>
    <button onclick="goSNS()">📱 SNS</button>
  </nav>

</header>


<main>

<section class="hero" id="accueil">

  <h1>Bienvenue sur Anime Manga</h1>

  <p>
    Découvre tes anime préférés au même endroit.
  </p>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Rechercher un anime..."
      oninput="searchAnime()"
    >

    <button onclick="searchAnime()">
      Rechercher
    </button>
  </div>

</section>


<section id="anime">

  <h2 class="section-title">🔥 Anime populaires</h2>

  <div class="cards" id="animeCards"></div>

  <div class="empty" id="empty">
    Aucun anime trouvé.
  </div>

</section>


<section id="sns">

  <h2 class="section-title">📱 SNS</h2>

  <div class="sns">

    <p>
      Retrouvez RABESAIKY ANIME et découvrez les nouveautés.
    </p>

    <button onclick="alert('SNS bientôt disponible !')">
      Suivre
    </button>

  </div>

</section>

</main>


<!-- MODAL ANIME -->

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <h2 id="modalTitle"></h2>

    <div class="modal-info" id="modalInfo"></div>

    <div class="modal-desc" id="modalDesc"></div>

    <h3 class="episode-title">
      📺 Saison 1
    </h3>

    <div class="episode-list" id="episodeList"></div>

    <div class="player">

      <video id="videoPlayer" controls playsinline>
        <source id="videoSource" src="" type="video/mp4">
        Ton navigateur ne peut pas lire cette vidéo.
      </video>

      <div class="player-message" id="playerMessage">
        Sélectionne un épisode.
      </div>

    </div>

  </div>

</div>


<!-- MENU MOBILE -->

<div class="bottom-nav">

  <button onclick="goHome()">
    <span>🏠</span>
    Accueil
  </button>

  <button onclick="goAnime()">
    <span>🎬</span>
    Anime
  </button>

  <button onclick="goSNS()">
    <span>📱</span>
    SNS
  </button>

  <button onclick="focusSearch()">
    <span>🔎</span>
    Recherche
  </button>

</div>


<script>

const animes = [

  {
    title:"Jujutsu Kaisen",
    rating:"8.6",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/1171/109222.jpg",
    desc:"Yuji Itadori entre dans le monde des malédictions après avoir avalé un doigt de Sukuna."
  },

  {
    title:"Naruto",
    rating:"8.4",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/13/17405.jpg",
    desc:"Naruto rêve de devenir le meilleur ninja de son village."
  },

  {
    title:"Dragon Ball",
    rating:"8.0",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/6/20936.jpg",
    desc:"Les aventures de Goku et de ses amis à la recherche des Dragon Balls."
  },

  {
    title:"One Piece",
    rating:"9.0",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/6/73245.jpg",
    desc:"Luffy et son équipage partent à la recherche du légendaire One Piece."
  },

  {
    title:"Demon Slayer",
    rating:"8.6",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg",
    desc:"Tanjiro devient pourfendeur de démons afin de sauver sa sœur."
  },

  {
    title:"Frieren",
    rating:"9.0",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/1015/138006.jpg",
    desc:"Frieren voyage après la fin de l'aventure de son ancien groupe de héros."
  },

  {
    title:"Re:Zero",
    rating:"8.2",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/1522/128039.jpg",
    desc:"Subaru découvre qu'il peut revenir dans le passé après certains événements."
  },

  {
    title:"My Hero Academia",
    rating:"8.0",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/10/78745.jpg",
    desc:"Izuku rêve de devenir un héros malgré son absence de pouvoir."
  },

  {
    title:"Spy x Family",
    rating:"8.5",
    type:"TV",
    image:"https://cdn.myanimelist.net/images/anime/1441/122795.jpg",
    desc:"Une famille particulière cache chacun un secret."
  },

  {
    title:"Kaiju No. 8",
    rating:"8.3",
    type:"TV",
    image:"https://kaiju-no8.net/en/special/img/keyvisual/visual_03.jpg",
    desc:"Kafka Hibino rêve de rejoindre les forces de défense et se retrouve lié à un mystérieux kaiju."
  },

  {
    title:"Ajin",
    rating:"7.8",
    type:"TV",
    image:"./ajin-poster.jpg",
    desc:"Kei découvre qu'il est un Ajin et doit fuir alors que ses pouvoirs sont recherchés."
  },

  {
    title:"To Be Hero X",
    rating:"8.0",
    type:"TV",
    image:"./To-Be-Hero-X-anime-visual-2.webp",
    desc:"Dans un monde où la confiance du public détermine les pouvoirs des héros."
  }

];


const animeCards =
document.getElementById("animeCards");


function createCard(anime){

  const card=document.createElement("div");

  card.className="card";

  card.innerHTML=`

    <div class="poster">

      <img
        src="${anime.image}"
        alt="${anime.title}"
      >

      <div class="poster-fallback">
        ${anime.title}
      </div>

    </div>

    <div class="info">

      <h3>${anime.title}</h3>

      <div class="meta">

        <span class="rating">
          ⭐ ${anime.rating}
        </span>

        <span>
          ${anime.type}
        </span>

      </div>

      <button class="episodes-btn">
        Saisons / Épisodes
      </button>

    </div>

  `;


  const img=card.querySelector("img");

  const fallback=card.querySelector(".poster-fallback");

  img.onerror=function(){

    img.style.display="none";

    fallback.style.display="flex";

  };


  card
    .querySelector(".episodes-btn")
    .onclick=function(){

      openAnime(anime);

    };


  return card;

}


function render(list=animes){

  animeCards.innerHTML="";

  const empty=document.getElementById("empty");

  if(list.length===0){

    empty.style.display="block";

    return;

  }

  empty.style.display="none";

  list.forEach(anime=>{

    animeCards.appendChild(
      createCard(anime)
    );

  });

}


function searchAnime(){

  const value=
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


  if(value===""){

    render(animes);

    return;

  }


  const results=
    animes.filter(anime=>
      anime.title
      .toLowerCase()
      .includes(value)
    );


  render(results);

}


function openAnime(anime){

  document
    .getElementById("modalTitle")
    .textContent=anime.title;


  document
    .getElementById("modalInfo")
    .textContent=
      "⭐ Note : "
      + anime.rating
      + "  •  📺 "
      + anime.type;


  document
    .getElementById("modalDesc")
    .textContent=
      anime.desc;


  const episodeList=
    document.getElementById("episodeList");


  episodeList.innerHTML="";


  /*
    IMPORTANT :

    Les fichiers ci-dessous sont des exemples
    pour TES propres vidéos ou vidéos dont tu
    as l'autorisation de diffusion.

    Exemple :
    videos/jujutsu-s1-e1.mp4
    videos/jujutsu-s1-e2.mp4
    etc.
  */


  for(let i=1;i<=24;i++){

    const button=
      document.createElement("button");

    button.className="episode";

    button.textContent=
      "Épisode "+i;


    button.onclick=function(){

      playEpisode(anime,i);

    };


    episodeList.appendChild(button);

  }


  document
    .getElementById("modal")
    .classList.add("show");


  resetPlayer();

}


function playEpisode(anime,episode){

  const video=
    document.getElementById("videoPlayer");

  const source=
    document.getElementById("videoSource");

  const message=
    document.getElementById("playerMessage");


  /*
    Pour une vidéo autorisée :

    videos/jujutsu-s1-e1.mp4
    videos/jujutsu-s1-e2.mp4
    etc.
  */


  let slug=
    anime.title
      .toLowerCase()
      .replaceAll(" ","-")
      .replaceAll("x","x");


  source.src=
    "./videos/"
    + slug
    + "-s1-e"
    + episode
    + ".mp4";


  video.load();


  message.textContent=
    anime.title
    + " — Épisode "
    + episode;


  const buttons=
    document.querySelectorAll(".episode");


  buttons.forEach((button,index)=>{

    button.classList.toggle(
      "active",
      index+1===episode
    );

  });


  video.play().catch(()=>{});

}


function resetPlayer(){

  const video=
    document.getElementById("videoPlayer");

  const source=
    document.getElementById("videoSource");

  source.src="";

  video.load();

  document
    .getElementById("playerMessage")
    .textContent=
      "Sélectionne un épisode.";

}


function closeModal(){

  const modal=
    document.getElementById("modal");

  const video=
    document.getElementById("videoPlayer");

  video.pause();

  modal.classList.remove("show");

}


document
  .getElementById("modal")
  .addEventListener("click",function(event){

    if(event.target===this){

      closeModal();

    }

  });


function goHome(){

  document
    .getElementById("accueil")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function goAnime(){

  document
    .getElementById("anime")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function goSNS(){

  document
    .getElementById("sns")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function focusSearch(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  setTimeout(()=>{

    document
      .getElementById("searchInput")
      .focus();

  },400);

}


render(animes);

</script>

</body>
        </html>
