<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeZone</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#090811;
  color:white;
}

/* NAVBAR */
header{
  position:sticky;
  top:0;
  z-index:100;
  background:#100d1c;
  border-bottom:1px solid #282035;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:18px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#ff2f92;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:25px;
  font-weight:bold;
}

nav a:hover{
  color:#ff2f92;
}

/* HERO */
.hero{
  min-height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  background:
    radial-gradient(circle at 50% 20%,#54206d,#160e25 45%,#090811 80%);
}

.hero h1{
  font-size:55px;
  line-height:1.1;
  margin-bottom:20px;
}

.pink{
  color:#ff2f92;
}

.hero p{
  color:#bbb7c5;
  font-size:19px;
  margin-bottom:30px;
}

.search{
  width:100%;
  max-width:600px;
  padding:18px 25px;
  border:none;
  outline:none;
  border-radius:35px;
  font-size:17px;
}

/* CONTENT */
.container{
  max-width:1200px;
  margin:auto;
  padding:45px 25px;
}

.section-title{
  font-size:30px;
  margin-bottom:25px;
}

.section-title span{
  color:#ff2f92;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.card{
  background:#151320;
  border:1px solid #272335;
  border-radius:15px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#ff2f92;
  box-shadow:0 10px 30px #0008;
}

.poster{
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  background:
    linear-gradient(145deg,#ff2f92,#551d7d,#171126);
}

.poster h3{
  font-size:28px;
  text-shadow:0 3px 10px #000;
}

.info{
  padding:17px;
}

.info h3{
  font-size:19px;
  margin-bottom:10px;
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:14px;
}

.rating{
  color:#ffd447;
}

.watch{
  display:block;
  text-align:center;
  margin-top:15px;
  padding:11px;
  background:#ff2f92;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.watch:hover{
  background:#d91b75;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:60px;
  color:#aaa;
  display:none;
}

/* FOOTER */
footer{
  margin-top:50px;
  padding:35px;
  text-align:center;
  background:#100d1c;
  color:#777;
}

/* MOBILE */
@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .nav{
    padding:16px;
  }

  .logo{
    font-size:23px;
  }

  nav a{
    margin-left:12px;
    font-size:14px;
  }

  .hero{
    min-height:350px;
  }

  .hero h1{
    font-size:38px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .poster{
    height:220px;
  }

  .poster h3{
    font-size:21px;
  }

  .container{
    padding:30px 15px;
  }
}

@media(max-width:380px){
  .grid{
    grid-template-columns:1fr;
  }

  .poster{
    height:280px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">ANIMEZONE</div>

    <nav>
      <a href="#">Accueil</a>
      <a href="#anime">Anime</a>
    </nav>

  </div>
</header>


<section class="hero">

  <div>

    <h1>
      Bienvenue sur<br>
      <span class="pink">AnimeZone</span>
    </h1>

    <p>
      Découvrez vos anime préférés.
    </p>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Rechercher un anime..."
    >

  </div>

</section>


<main class="container" id="anime">

  <h2 class="section-title">
    🔥 Anime <span>populaires</span>
  </h2>

  <div id="animeGrid" class="grid"></div>

  <div id="empty" class="empty">
    Aucun anime trouvé.
  </div>

</main>


<footer>
  © 2026 AnimeZone — Tous droits réservés
</footer>


<script>

const anime = [

  {
    title:"Naruto",
    type:"TV",
    score:"8.4"
  },

  {
    title:"One Piece",
    type:"TV",
    score:"9.0"
  },

  {
    title:"Demon Slayer",
    type:"TV",
    score:"8.6"
  },

  {
    title:"Jujutsu Kaisen",
    type:"TV",
    score:"8.5"
  },

  {
    title:"Attack on Titan",
    type:"TV",
    score:"9.1"
  },

  {
    title:"Dragon Ball",
    type:"TV",
    score:"8.4"
  },

  {
    title:"Bleach",
    type:"TV",
    score:"8.2"
  },

  {
    title:"Solo Leveling",
    type:"TV",
    score:"8.8"
  },

  {
    title:"My Hero Academia",
    type:"TV",
    score:"8.0"
  },

  {
    title:"Black Clover",
    type:"TV",
    score:"8.1"
  },

  {
    title:"Death Note",
    type:"TV",
    score:"8.6"
  },

  {
    title:"Hunter x Hunter",
    type:"TV",
    score:"9.0"
  }

];


const grid = document.getElementById("animeGrid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");


function afficherAnime(liste){

  grid.innerHTML = "";

  if(liste.length === 0){
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  liste.forEach(a => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="poster">
        <h3>${a.title}</h3>
      </div>

      <div class="info">

        <h3>${a.title}</h3>

        <div class="meta">

          <span>${a.type}</span>

          <span class="rating">
            ⭐ ${a.score}
          </span>

        </div>

        <a href="#" class="watch">
          ▶ Regarder
        </a>

      </div>

    `;

    grid.appendChild(card);

  });

}


search.addEventListener("input", () => {

  const q = search.value.toLowerCase().trim();

  const resultats = anime.filter(a =>
    a.title.toLowerCase().includes(q)
  );

  afficherAnime(resultats);

});


afficherAnime(anime);

</script>

</body>
</html>
