<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RABESAIKY ANIME</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      background: #111118;
      padding: 15px 20px;
      border-bottom: 1px solid #292933;
    }

    .navbar {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .logo img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 10px;
    }

    nav a {
      color: #bbb;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      max-width: 1100px;
      min-height: 320px;
      margin: 25px auto;
      padding: 40px;
      border-radius: 18px;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.9),
          rgba(0,0,0,0.3)
        ),
        url("photo.jpg") center/cover;
      
      display: flex;
      align-items: center;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #e50914;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .anime-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    .anime-card {
      background: #15151d;
      border: 1px solid #292933;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.2s;
    }

    .anime-card:hover {
      transform: translateY(-5px);
    }

    .anime-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
    }

    .anime-info {
      padding: 12px;
    }

    .anime-info h3 {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .anime-info p {
      color: #999;
      font-size: 12px;
    }

    footer {
      margin-top: 50px;
      padding: 30px;
      text-align: center;
      color: #777;
      border-top: 1px solid #222;
    }

    @media (max-width: 650px) {

      nav {
        display: none;
      }

      .hero {
        margin: 15px;
        padding: 25px;
        min-height: 280px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .anime-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <header>
    <div class="navbar">

      <a href="#" class="logo">
        <img src="photo.jpg" alt="RABESAIKY ANIME">
        <span>RABESAIKY ANIME</span>
      </a>

      <nav>
        <a href="#">Accueil</a>
        <a href="#animes">Animes</a>
        <a href="#nouveautes">Nouveautés</a>
      </nav>

    </div>
  </header>


  <!-- ACCUEIL -->
  <section class="hero">

    <div class="hero-content">

      <h1>RABESAIKY ANIME</h1>

      <p>
        Bienvenue sur RABESAIKY ANIME.
        Retrouve ici tes animes et épisodes préférés.
      </p>

      <a href="#animes" class="button">
        Voir les animes
      </a>

    </div>

  </section>


  <!-- ANIMES -->
  <main id="animes">

    <h2>Anime</h2>

    <div class="anime-grid">

      <div class="anime-card">

        <img src="photo.jpg" alt="Anime">

        <div class="anime-info">
          <h3>Anime 01</h3>
          <p>Épisode 01</p>
        </div>

      </div>


      <div class="anime-card">

        <img src="photo.jpg" alt="Anime">

        <div class="anime-info">
          <h3>Anime 02</h3>
          <p>Épisode 01</p>
        </div>

      </div>


      <div class="anime-card">

        <img src="photo.jpg" alt="Anime">

        <div class="anime-info">
          <h3>Anime 03</h3>
          <p>Épisode 01</p>
        </div>

      </div>


      <div class="anime-card">

        <img src="photo.jpg" alt="Anime">

        <div class="anime-info">
          <h3>Anime 04</h3>
          <p>Épisode 01</p>
        </div>

      </div>

    </div>

  </main>


  <!-- PIED DE PAGE -->
  <footer>

    © 2026 RABESAIKY ANIME

  </footer>

</body>
</html>
